# Retrieval gold set: a question is answered when the retrieved chunks contain
# the answer text. Chunk ids are never used (they change on every re-ingest).
#
#   id        unique, stable
#   tag       numeric_table | numeric_prose | narrative | vocab_mismatch
#             | multi_part | 8k_by_date
#   ticker    required; filing_types / filed_after / filed_before optional
#   question  plain language, as the agent would ask it
#   answers   strings that must appear verbatim in the chunks (whitespace and
#             curly quotes are normalised)
#   require   any (default): one answer string suffices
#             all: every answer string must appear somewhere in the top-k
#
# Verify the strings still exist in the corpus: eval_retrieval --check-gold
# Seeded 2026-10-17 from real agent questions on ACN and AVGO.

